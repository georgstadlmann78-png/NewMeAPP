<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>New Me - Checklist & Habit Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Mobile-first and smooth UI tweaks */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, select, textarea {
      user-select: auto;
    }
    /* Safe padding for bottom nav */
    .pb-safe {
      padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px));
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 4px;
    }
  </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 font-sans antialiased flex flex-col justify-between selection:bg-sky-500 selection:text-white">

  <!-- APP CONTAINER -->
  <div class="flex-1 flex flex-col max-w-md w-full mx-auto bg-slate-900 min-h-screen relative shadow-2xl overflow-x-hidden">
    
    <!-- TOP HEADER -->
    <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20">
          <i class="fa-solid fa-bolt text-white text-sm"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
            New Me
            <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-sky-500/20 text-sky-400 font-medium">Pro</span>
          </h1>
          <p id="headerSubText" class="text-xs text-slate-400 font-medium leading-none">Heute</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="btnRefreshTasks" title="Tasks aktualisieren" class="p-2 text-slate-400 hover:text-sky-400 hover:bg-slate-800 rounded-xl transition-all active:scale-95">
          <i class="fa-solid fa-arrows-rotate text-sm"></i>
        </button>
        <button id="btnOpenAddTask" class="flex items-center gap-1.5 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white px-3 py-1.5 rounded-xl font-semibold text-xs shadow-md shadow-sky-500/25 active:scale-95 transition-all">
          <i class="fa-solid fa-plus text-xs"></i>
          <span>Neu</span>
        </button>
      </div>
    </header>

    <!-- MAIN SCROLLABLE CONTENT -->
    <main class="flex-1 overflow-y-auto px-4 py-4 pb-safe space-y-4">
      
      <!-- ================= VIEW 1: CHECKLIST ================= -->
      <section id="viewChecklist" class="space-y-4">
        
        <!-- DATE SELECTOR STRIP -->
        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3 shadow-sm">
          <div class="flex items-center justify-between mb-2">
            <button id="btnPrevDay" class="w-8 h-8 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition active:scale-95">
              <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <div class="text-center cursor-pointer" id="btnTriggerDatePicker">
              <div class="text-sm font-semibold text-white flex items-center justify-center gap-1.5">
                <span id="displayDateLabel">Heute</span>
                <i class="fa-regular fa-calendar text-xs text-sky-400"></i>
              </div>
              <div id="displayDateSub" class="text-[11px] text-slate-400">Samstag, 31. Okt 2026</div>
              <input type="date" id="hiddenDatePicker" class="sr-only">
            </div>
            <button id="btnNextDay" class="w-8 h-8 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition active:scale-95">
              <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
          </div>

          <!-- Quick Jump Buttons & Day Score -->
          <div class="flex items-center justify-between pt-2 border-t border-slate-700/50 text-xs">
            <button id="btnJumpToday" class="text-sky-400 hover:underline font-medium text-[11px] flex items-center gap-1">
              <i class="fa-solid fa-calendar-day text-[10px]"></i> Zu Heute springen
            </button>
            <div class="text-slate-300 font-medium text-[11px]">
              Tages-Score: <span id="dayScoreBadge" class="font-bold text-sky-400">0 / 0 Pkt</span>
            </div>
          </div>
        </div>

        <!-- TASKS LIST SECTION (Categorized) -->
        <div id="tasksContainer" class="space-y-4">
          <!-- Dynamically populated categories & tasks -->
        </div>

      </section>

      <!-- ================= VIEW 2: STATISTIK ================= -->
      <section id="viewStats" class="space-y-4 hidden">
        <div class="bg-slate-800/70 border border-slate-700/60 rounded-2xl p-4">
          <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider mb-3 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-sky-400"></i> Punkte-Auswertung
          </h2>

          <!-- PERIOD SELECTOR -->
          <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900/80 rounded-xl mb-4 border border-slate-700/60">
            <button id="statTabWeek" class="py-1.5 text-xs font-semibold rounded-lg bg-sky-500 text-white transition">Diese Woche</button>
            <button id="statTabAll" class="py-1.5 text-xs font-medium text-slate-400 hover:text-slate-200 rounded-lg transition">Gesamtzeitraum</button>
          </div>

          <!-- SUMMARY SCORE CARD -->
          <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl p-4 border border-slate-700/70 shadow-md">
            <div class="flex justify-between items-center mb-1">
              <span id="statScopeTitle" class="text-xs font-medium text-slate-400">Aktuelle Woche (KW --)</span>
              <span id="statPercentBadge" class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">0%</span>
            </div>
            <div class="flex items-baseline gap-2 mb-2">
              <span id="statEarnedPoints" class="text-3xl font-extrabold text-white">0</span>
              <span class="text-sm text-slate-400">von</span>
              <span id="statTotalPoints" class="text-lg font-bold text-slate-300">0 Pkt</span>
            </div>
            <!-- Progress bar -->
            <div class="w-full bg-slate-700/80 h-2.5 rounded-full overflow-hidden">
              <div id="statProgressBar" class="h-full bg-gradient-to-r from-sky-400 to-emerald-400 transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- BREAKDOWN PER GROUP & TASK -->
        <div class="space-y-3" id="statsGroupsContainer">
          <!-- Dynamically inserted stats per category & task -->
        </div>
      </section>

      <!-- ================= VIEW 3: AUFGABEN VERWALTEN ================= -->
      <section id="viewManage" class="space-y-4 hidden">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider">Erfasste Aufgaben</h2>
          <span id="manageTaskCount" class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded-md">11 Aufgaben</span>
        </div>

        <div id="manageTasksList" class="space-y-2.5">
          <!-- Dynamically inserted editable task rows -->
        </div>

        <button id="btnResetToDefaults" class="w-full py-2.5 border border-dashed border-rose-500/40 text-rose-400/90 hover:bg-rose-500/10 rounded-xl text-xs font-medium flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-rotate-left"></i> Auf Werkseinstellungen zurücksetzen
        </button>
      </section>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 px-6 py-2.5 flex items-center justify-around z-30">
      <button id="navBtnChecklist" class="flex flex-col items-center gap-1 text-sky-400 transition active:scale-90">
        <i class="fa-solid fa-list-check text-lg"></i>
        <span class="text-[10px] font-semibold tracking-wide">Checkliste</span>
      </button>

      <button id="navBtnStats" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition active:scale-90">
        <i class="fa-solid fa-chart-simple text-lg"></i>
        <span class="text-[10px] font-semibold tracking-wide">Statistik</span>
      </button>

      <button id="navBtnManage" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition active:scale-90">
        <i class="fa-solid fa-sliders text-lg"></i>
        <span class="text-[10px] font-semibold tracking-wide">Verwalten</span>
      </button>
    </nav>

    <!-- ================= MODAL: ADD / EDIT TASK ================= -->
    <div id="modalTask" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
      <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in slide-in-from-bottom-6">
        
        <!-- Modal Header -->
        <div class="px-5 py-4 border-b border-slate-700/80 flex items-center justify-between">
          <h3 id="modalTitle" class="text-base font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-pen-to-square text-sky-400"></i> Neue Aufgabe erstellen
          </h3>
          <button id="btnCloseModal" class="w-8 h-8 rounded-full bg-slate-700/50 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-sm transition">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Form Body -->
        <form id="taskForm" class="p-5 overflow-y-auto space-y-4 text-xs">
          <input type="hidden" id="formTaskId">

          <!-- Task Title -->
          <div>
            <label class="block text-slate-300 font-medium mb-1.5">Titel / Bezeichnung *</label>
            <input type="text" id="formTitle" required placeholder="z. B. 20 min Laufen" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 text-xs">
          </div>

          <!-- Category / Group -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-300 font-medium mb-1.5">Kategorie / Gruppe</label>
              <select id="formCategorySelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
                <option value="Fitness">Fitness</option>
                <option value="Mindset & Wissen">Mindset & Wissen</option>
                <option value="Soziales">Soziales</option>
                <option value="Sex">Sex</option>
                <option value="__NEW__">+ Neue Gruppe...</option>
              </select>
            </div>
            <div id="customCategoryWrapper" class="hidden">
              <label class="block text-slate-300 font-medium mb-1.5">Neue Gruppe Name</label>
              <input type="text" id="formCategoryCustom" placeholder="z. B. Finanzen" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
            </div>
          </div>

          <!-- Type Selector -->
          <div>
            <label class="block text-slate-300 font-medium mb-1.5">Aufgabentyp</label>
            <div class="grid grid-cols-3 gap-2">
              <label class="cursor-pointer border border-slate-700 p-2.5 rounded-xl flex flex-col items-center gap-1 text-center bg-slate-900/60 hover:bg-slate-900 peer-checked:border-sky-500 transition">
                <input type="radio" name="formType" value="A" checked class="peer sr-only">
                <span class="font-bold text-xs text-sky-400 peer-checked:text-sky-300">Typ A</span>
                <span class="text-[10px] text-slate-400">Täglich / Fest</span>
              </label>
              <label class="cursor-pointer border border-slate-700 p-2.5 rounded-xl flex flex-col items-center gap-1 text-center bg-slate-900/60 hover:bg-slate-900 peer-checked:border-amber-500 transition">
                <input type="radio" name="formType" value="B" class="peer sr-only">
                <span class="font-bold text-xs text-amber-400">Typ B</span>
                <span class="text-[10px] text-slate-400">Mit Übertrag</span>
              </label>
              <label class="cursor-pointer border border-slate-700 p-2.5 rounded-xl flex flex-col items-center gap-1 text-center bg-slate-900/60 hover:bg-slate-900 peer-checked:border-purple-500 transition">
                <input type="radio" name="formType" value="C" class="peer sr-only">
                <span class="font-bold text-xs text-purple-400">Typ C</span>
                <span class="text-[10px] text-slate-400">Beliebig oft</span>
              </label>
            </div>
            <p id="typeDescription" class="mt-1.5 text-[11px] text-slate-400 italic">
              Typ A: Fällt an ausgewählten Wochentagen fix an.
            </p>
          </div>

          <!-- Days Selection (Types A & B) -->
          <div id="weekdaysSelector">
            <label class="block text-slate-300 font-medium mb-1.5">Wochentage</label>
            <div class="grid grid-cols-7 gap-1">
              <label class="flex flex-col items-center text-center cursor-pointer">
                <input type="checkbox" value="1" class="day-check sr-only peer" checked>
                <div class="w-full py-2 rounded-lg bg-slate-900 border border-slate-700 peer-checked:bg-sky-500/20 peer-checked:border-sky-400 peer-checked:text-sky-300 text-slate-400 font-semibold text-[11px] transition">Mo</div>
              </label>
              <label class="flex flex-col items-center text-center cursor-pointer">
                <input type="checkbox" value="2" class="day-check sr-only peer" checked>
                <div class="w-full py-2 rounded-lg bg-slate-900 border border-slate-700 peer-checked:bg-sky-500/20 peer-checked:border-sky-400 peer-checked:text-sky-300 text-slate-400 font-semibold text-[11px] transition">Di</div>
              </label>
              <label class="flex flex-col items-center text-center cursor-pointer">
                <input type="checkbox" value="3" class="day-check sr-only peer" checked>
                <div class="w-full py-2 rounded-lg bg-slate-900 border border-slate-700 peer-checked:bg-sky-500/20 peer-checked:border-sky-400 peer-checked:text-sky-300 text-slate-400 font-semibold text-[11px] transition">Mi</div>
              </label>
              <label class="flex flex-col items-center text-center cursor-pointer">
                <input type="checkbox" value="4" class="day-check sr-only peer" checked>
                <div class="w-full py-2 rounded-lg bg-slate-900 border border-slate-700 peer-checked:bg-sky-500/20 peer-checked:border-sky-400 peer-checked:text-sky-300 text-slate-400 font-semibold text-[11px] transition">Do</div>
              </label>
              <label class="flex flex-col items-center text-center cursor-pointer">
                <input type="checkbox" value="5" class="day-check sr-only peer" checked>
                <div class="w-full py-2 rounded-lg bg-slate-900 border border-slate-700 peer-checked:bg-sky-500/20 peer-checked:border-sky-400 peer-checked:text-sky-300 text-slate-400 font-semibold text-[11px] transition">Fr</div>
              </label>
              <label class="flex flex-col items-center text-center cursor-pointer">
                <input type="checkbox" value="6" class="day-check sr-only peer" checked>
                <div class="w-full py-2 rounded-lg bg-slate-900 border border-slate-700 peer-checked:bg-sky-500/20 peer-checked:border-sky-400 peer-checked:text-sky-300 text-slate-400 font-semibold text-[11px] transition">Sa</div>
              </label>
              <label class="flex flex-col items-center text-center cursor-pointer">
                <input type="checkbox" value="0" class="day-check sr-only peer" checked>
                <div class="w-full py-2 rounded-lg bg-slate-900 border border-slate-700 peer-checked:bg-sky-500/20 peer-checked:border-sky-400 peer-checked:text-sky-300 text-slate-400 font-semibold text-[11px] transition">So</div>
              </label>
            </div>
          </div>

          <!-- Points & Target Config -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-300 font-medium mb-1.5">Punkte pro Erledigung</label>
              <select id="formPoints" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
                <option value="1">1.0 Punkt</option>
                <option value="1.5">1.5 Punkte</option>
                <option value="2">2.0 Punkte</option>
                <option value="0.5">0.5 Punkte</option>
                <option value="3">3.0 Punkte</option>
              </select>
            </div>

            <div id="weeklyTargetGroup" class="hidden">
              <label class="block text-slate-300 font-medium mb-1.5">Wochenziel (Pkt)</label>
              <input type="number" id="formWeeklyTarget" step="0.5" min="0.5" value="4" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
            </div>
          </div>

          <!-- Date Range (Begin & End) -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-300 font-medium mb-1.5">Beginndatum</label>
              <input type="date" id="formStartDate" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
            </div>
            <div>
              <label class="block text-slate-300 font-medium mb-1.5">Enddatum (optional)</label>
              <input type="date" id="formEndDate" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 focus:outline-none focus:border-sky-500 text-xs">
            </div>
          </div>

          <!-- Buttons -->
          <div class="pt-3 flex gap-2">
            <button type="button" id="btnCancelModal" class="flex-1 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:bg-slate-700/50 font-medium transition active:scale-95">Abbrechen</button>
            <button type="submit" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-semibold shadow-lg shadow-sky-500/20 transition active:scale-95">Speichern</button>
          </div>
        </form>
      </div>
    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-slate-800 border border-sky-500/40 text-slate-100 px-4 py-2.5 rounded-2xl shadow-xl text-xs flex items-center gap-2 pointer-events-none opacity-0 transition-opacity duration-300">
      <i class="fa-solid fa-circle-check text-sky-400" id="toastIcon"></i>
      <span id="toastMsg">Meldung</span>
    </div>

  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    /* ========================================================
       DATA STRUCTURES & DEFAULT PRELOADS
       ======================================================== */
    const STORAGE_KEY_TASKS = 'new_me_tasks_v2';

      {

        startDate: '2026-01-01',
        endDate: ''
      }
    ];

    // State
    let tasks = [];
    let logs = {}; // key: 'YYYY-MM-DD', value: { taskId: { completed: true, points: 2.0 } }
    let selectedDate = new Date();
    let currentTab = 'checklist';
    let statScope = 'week'; // 'week' | 'all'

    /* ========================================================
       DATE HELPERS
       ======================================================== */
    function formatIsoDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function parseIsoDate(str) {
      const parts = str.split('-');
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }

    function addDays(d, days) {
      const res = new Date(d);
      res.setDate(res.getDate() + days);
      return res;
    }

    function isToday(d) {
      const now = new Date();
      return d.toDateString() === now.toDateString();
    }

    function getDayOfWeek(d) {
      return d.getDay(); // 0 is Sunday, 1 is Monday ... 6 is Saturday
    }

    function getMondayOfWeek(d) {
      const day = d.getDay();
      const diff = (day === 0 ? -6 : 1) - day;
      const mon = new Date(d);
      mon.setDate(d.getDate() + diff);
      mon.setHours(0, 0, 0, 0);
      return mon;
    }

    function getWeekNumber(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    /* ========================================================
       PERSISTENCE & INIT
       ======================================================== */
    function loadData() {
      try {
        const storedTasks = localStorage.getItem(STORAGE_KEY_TASKS);
        tasks = storedTasks ? JSON.parse(storedTasks) : [...DEFAULT_TASKS];
      } catch (e) {
        tasks = [...DEFAULT_TASKS];
      }

      try {
        const storedLogs = localStorage.getItem(STORAGE_KEY_LOGS);
        logs = storedLogs ? JSON.parse(storedLogs) : {};
      } catch (e) {
        logs = {};
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(tasks));
        localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(logs));
      } catch (e) {
        console.error("Storage save failed", e);
      }
    }

    /* ========================================================
       CORE TASK RESOLUTION LOGIC FOR A GIVEN DATE
       ======================================================== */
    // Determines which tasks are present/active on date `targetDate`
    // Returns array of objects: { task, isDueToday, isRollover, completed, earnedPoints }
    function resolveTasksForDate(targetDate) {
      const dateStr = formatIsoDate(targetDate);
      const dayOfWeek = getDayOfWeek(targetDate);
      const dayLogs = logs[dateStr] || {};

      const activeTasks = [];

      for (const t of tasks) {
        // Date range checks
        if (t.startDate && dateStr < t.startDate) continue;
        if (t.endDate && dateStr > t.endDate) continue;

        let shouldShow = false;
        let isRollover = false;
        let isDueToday = false;

        if (t.type === 'A') {
          // Typ A: Nur an konfigurierten Wochentagen
          if (t.days.includes(dayOfWeek)) {
            shouldShow = true;
            isDueToday = true;
          }
        } else if (t.type === 'B') {
          // Typ B: Aufgaben mit Übertrag (Rollover)
          // 1. Wenn heute ein regulärer Tag ist:
          if (t.days.includes(dayOfWeek)) {
            shouldShow = true;
            isDueToday = true;
          } else {
            // 2. Prüfen, ob eine offene Aufgabe von vergangenen Tagen nach vorne getragen wird
            // Wir blicken zurück bis zum letzten geplanten Tag innerhalb der letzten 7 Tage
            let lookback = new Date(targetDate);
            let pendingRollover = false;

            for (let i = 1; i <= 7; i++) {
              lookback.setDate(lookback.getDate() - 1);
              const prevIso = formatIsoDate(lookback);
              if (t.startDate && prevIso < t.startDate) break;

              const prevDayWeek = getDayOfWeek(lookback);
              const wasCompletedOnPrev = !!(logs[prevIso] && logs[prevIso][t.id] && logs[prevIso][t.id].completed);

              if (wasCompletedOnPrev) {
                // Aufgabe wurde an diesem Tag erledigt -> kein weiterer Übertrag von davor
                break;
              }

              if (t.days.includes(prevDayWeek)) {
                // Hier fiel die Aufgabe regulär an und wurde bis heute nicht erledigt!
                pendingRollover = true;
                break;
              }
            }

            if (pendingRollover) {
              shouldShow = true;
              isRollover = true;
            }
          }
        } else if (t.type === 'C') {
          // Typ C: Beliebig oft / Ad-hoc / Gewohnheit - wird jeden Tag zur Auswahl angezeigt
          shouldShow = true;
          isDueToday = true;
        }

        if (shouldShow) {
          const logEntry = dayLogs[t.id];
          const isDone = !!(logEntry && logEntry.completed);
          const earned = isDone ? (logEntry.points !== undefined ? logEntry.points : t.points) : 0;

          activeTasks.push({
            task: t,
            isDueToday,
            isRollover,
            completed: isDone,
            earnedPoints: earned
          });
        }
      }

      return activeTasks;
    }

    /* ========================================================
       RENDER: CHECKLIST VIEW
       ======================================================== */
    function renderChecklistView() {
      const dateStr = formatIsoDate(selectedDate);
      const isDateCurrent = isToday(selectedDate);

      const dayNames = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
      const monthNames = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

      document.getElementById('displayDateSub').textContent = `${dayNames[selectedDate.getDay()]}, ${selectedDate.getDate()}. ${monthNames[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`;
      document.getElementById('headerSubText').textContent = isDateCurrent ? 'Checkliste für Heute' : `Nachtrag: ${selectedDate.toLocaleDateString('de-DE')}`;
      document.getElementById('hiddenDatePicker').value = dateStr;

      const activeList = resolveTasksForDate(selectedDate);
      const container = document.getElementById('tasksContainer');
      container.innerHTML = '';

      // Calculate Day Score
      let earnedToday = 0;
      let possibleToday = 0;

        // For possible score: Typ A and B contribute their value, Typ C contributes if completed
        if (item.task.type !== 'C') {
          possibleToday += item.task.points;
        } else if (item.completed) {
          possibleToday += item.earnedPoints;
        }
      });
      document.getElementById('dayScoreBadge').textContent = `${earnedToday.toFixed(1).replace('.0','')} / ${possibleToday.toFixed(1).replace('.0','')} Pkt`;

      if (activeList.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-8 text-center">
            <i class="fa-regular fa-calendar-check text-3xl text-slate-500 mb-2"></i>

          </div>

      // Group active tasks by category
      const grouped = {};

        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(item);

      // Render each category block
      for (const [category, items] of Object.entries(grouped)) {
        const catCard = document.createElement('div');
        catCard.className = 'bg-slate-800/80 border border-slate-700/70 rounded-2xl overflow-hidden shadow-sm';

        // Header for Category
        const completedInCat = items.filter(i => i.completed).length;
        const catHeader = document.createElement('div');
        catHeader.className = 'px-4 py-2.5 bg-slate-850/90 border-b border-slate-700/50 flex items-center justify-between';
        catHeader.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-sky-400"></span>
            <span class="text-xs font-bold uppercase tracking-wider text-slate-200">${escapeHtml(category)}</span>
          </div>
          <span class="text-[11px] font-medium text-slate-400">${completedInCat}/${items.length}</span>
        `;
        catCard.appendChild(catHeader);

        // Task Items list
        const listDiv = document.createElement('div');
        listDiv.className = 'divide-y divide-slate-700/40';

        items.forEach(item => {
          const t = item.task;
          const isDone = item.completed;
          const taskRow = document.createElement('div');
          taskRow.className = `p-3.5 flex items-center justify-between gap-3 transition-colors ${isDone ? 'bg-emerald-950/20' : 'hover:bg-slate-750/30'}`;

          // Type badge styling
          let typeBadge = '';
          if (t.type === 'A') {
            typeBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-sky-500/20 text-sky-300">A</span>`;
          } else if (t.type === 'B') {
            typeBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-300" title="Aufgabe mit Vortrag">B ${item.isRollover ? '• Übertrag' : ''}</span>`;
          } else if (t.type === 'C') {
            typeBadge = `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-purple-500/20 text-purple-300" title="Beliebig oft / Ziel: ${t.weeklyTarget} Pkt">C Ziel ${t.weeklyTarget}p</span>`;
          }

          taskRow.innerHTML = `
            <div class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer select-none" data-action="toggle" data-id="${t.id}">
              <!-- Touch-Friendly Custom Checkbox -->
              <div class="w-6 h-6 rounded-lg flex items-center justify-center border transition-all ${isDone ? 'bg-emerald-500 border-emerald-400 text-white shadow-md shadow-emerald-500/30' : 'border-slate-600 bg-slate-900/80 text-transparent'}">
                <i class="fa-solid fa-check text-xs"></i>
              </div>

              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5 flex-wrap">
                  <span class="text-xs font-semibold ${isDone ? 'text-slate-400 line-through' : 'text-slate-100'} break-words">
                    ${escapeHtml(t.title)}
                  </span>
                  ${typeBadge}
                </div>
                <div class="text-[11px] text-slate-400 mt-0.5 flex items-center gap-2">
                  <span>${isDone ? '+' + item.earnedPoints + ' Pkt gesammelt' : t.points + ' Pkt möglich'}</span>
                  ${item.isRollover && !isDone ? '<span class="text-amber-400 font-medium text-[10px]"><i class="fa-solid fa-clock-rotate-left"></i> Von gestern vorgetragen</span>' : ''}
                </div>
              </div>
            </div>

            <!-- Context Actions / Quick Point selector for Type C or Edit -->
            <div class="flex items-center gap-1">
              ${t.type === 'C' ? `
                <select class="quick-points-select bg-slate-900 border border-slate-700 text-slate-200 text-[10px] rounded-lg px-1.5 py-1 focus:outline-none" data-id="${t.id}" title="Punkte für heute">
                  <option value="1" ${item.earnedPoints === 1 || t.points === 1 ? 'selected' : ''}>1.0p</option>
                  <option value="1.5" ${item.earnedPoints === 1.5 || t.points === 1.5 ? 'selected' : ''}>1.5p</option>
                  <option value="2" ${item.earnedPoints === 2 || t.points === 2 ? 'selected' : ''}>2.0p</option>
                  <option value="3" ${item.earnedPoints === 3 || t.points === 3 ? 'selected' : ''}>3.0p</option>
                </select>
              ` : ''}
            </div>
          `;

          // Event Listener for Toggling
          taskRow.querySelector('[data-action="toggle"]').addEventListener('click', (e) => {
            toggleTaskCompletion(t.id, dateStr, item.earnedPoints || t.points);
          });

          // Event Listener for Typ C point override
          const ptSelect = taskRow.querySelector('.quick-points-select');
          if (ptSelect) {
            ptSelect.addEventListener('change', (e) => {
              const val = parseFloat(e.target.value);
              updateTaskPointsForDay(t.id, dateStr, val);
            });
          }

          listDiv.appendChild(taskRow);
        });

        catCard.appendChild(listDiv);
        container.appendChild(catCard);
      }
    }

    /* ========================================================
       TASK TOGGLING & COMPLETION HANDLERS
       ======================================================== */
    function toggleTaskCompletion(taskId, dateStr, defaultPoints) {
      if (!logs[dateStr]) {
        logs[dateStr] = {};
      }

      const current = logs[dateStr][taskId];
      const task = tasks.find(x => x.id === taskId);
      const pointsToAward = defaultPoints || (task ? task.points : 1);

      if (current && current.completed) {
        // Unmark
        delete logs[dateStr][taskId];
        showToast('Aufgabe als offen markiert', 'info');
      } else {
        // Mark as completed
        logs[dateStr][taskId] = {
          completed: true,
          points: pointsToAward,
          completedAt: new Date().toISOString()
        };
        showToast(`Erledigt! +${pointsToAward} Punkte gutgeschrieben`, 'success');
      }

      saveData();
      renderChecklistView();
    }

    function updateTaskPointsForDay(taskId, dateStr, points) {
      if (!logs[dateStr]) logs[dateStr] = {};
      if (logs[dateStr][taskId] && logs[dateStr][taskId].completed) {
        logs[dateStr][taskId].points = points;
        saveData();
        renderChecklistView();
        showToast(`Punkte angepasst auf ${points}`, 'info');
      } else {
        // Mark as completed with these points
        logs[dateStr][taskId] = {
          completed: true,
          points: points,
          completedAt: new Date().toISOString()
        };
        saveData();
        renderChecklistView();
        showToast(`Erledigt mit ${points} Punkten!`, 'success');
      }
    }

    /* ========================================================
       STATISTICS CALCULATION & RENDERING
       ======================================================== */
    function renderStatisticsView() {
      const container = document.getElementById('statsGroupsContainer');
      container.innerHTML = '';

      let startDate, endDate;
      const today = new Date();

      if (statScope === 'week') {
        const mon = getMondayOfWeek(selectedDate);
        const sun = addDays(mon, 6);
        startDate = mon;
        endDate = sun;
        document.getElementById('statScopeTitle').textContent = `Woche KW ${getWeekNumber(selectedDate)} (${mon.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'})} - ${sun.toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit'})})`;
      } else {
        // Overall: Find earliest start date from tasks or logs
        let earliest = new Date();
        tasks.forEach(t => {
          if (t.startDate) {
            const p = parseIsoDate(t.startDate);
            if (p < earliest) earliest = p;
          }
        });
        startDate = earliest;
        endDate = today;
        document.getElementById('statScopeTitle').textContent = `Gesamtzeitraum (${startDate.toLocaleDateString('de-DE')} bis heute)`;
      }

      // Aggregate points per task and group
      // For each day in range, compute earned and possible points
      let totalEarned = 0;
      let totalTheoretical = 0;

      const taskStats = {};
      tasks.forEach(t => {
        taskStats[t.id] = {
          task: t,
          earned: 0,
          theoretical: 0,
          occurrences: 0,
          completedCount: 0
        };
      });

      // Iterate day by day in chosen interval
      let curr = new Date(startDate);
      const endLimit = new Date(endDate);
      endLimit.setHours(23, 59, 59, 999);

      // Loop days
      while (curr <= endLimit) {
        const dStr = formatIsoDate(curr);
        const dayTasks = resolveTasksForDate(curr);

        dayTasks.forEach(item => {
          const s = taskStats[item.task.id];
          if (!s) return;

          s.occurrences++;
          if (item.completed) {
            s.completedCount++;
            s.earned += item.earnedPoints;
          }

          // For theoretical points:
          // Typ A: points each day it's scheduled
          if (item.task.type === 'A' && item.isDueToday) {
            s.theoretical += item.task.points;
          }
          // Typ B: each scheduled day counts as its points
          else if (item.task.type === 'B' && item.isDueToday) {
            s.theoretical += item.task.points;
          }
        });

        curr.setDate(curr.getDate() + 1);
      }

      // Typ C theoretical calculation based on weeklyTarget
      if (statScope === 'week') {
        tasks.filter(t => t.type === 'C').forEach(t => {
          const s = taskStats[t.id];
          if (s) {
            s.theoretical = t.weeklyTarget || (t.points * 2);
          }
        });
      } else {
        // For total period, estimate number of weeks between startDate and endDate
        const diffWeeks = Math.max(1, Math.round((endLimit - startDate) / (7 * 86400000)));
        tasks.filter(t => t.type === 'C').forEach(t => {
          const s = taskStats[t.id];
          if (s) {
            s.theoretical = (t.weeklyTarget || (t.points * 2)) * diffWeeks;
          }
        });
      }

      // Compute total sum
      Object.values(taskStats).forEach(s => {
        totalEarned += s.earned;
        totalTheoretical += s.theoretical;
      });

      // Update Summary UI
      const percent = totalTheoretical > 0 ? Math.min(100, Math.round((totalEarned / totalTheoretical) * 100)) : 0;
      document.getElementById('statEarnedPoints').textContent = totalEarned.toFixed(1).replace('.0','');
      document.getElementById('statTotalPoints').textContent = `${totalTheoretical.toFixed(1).replace('.0','')} Pkt`;
      document.getElementById('statPercentBadge').textContent = `${percent}%`;
      document.getElementById('statProgressBar').style.width = `${percent}%`;

      // Group breakdown
      const groupMap = {};
      tasks.forEach(t => {
        const cat = t.category || 'Allgemein';
        if (!groupMap[cat]) groupMap[cat] = { earned: 0, theoretical: 0, items: [] };
        const s = taskStats[t.id];
        groupMap[cat].earned += s.earned;
        groupMap[cat].theoretical += s.theoretical;
        groupMap[cat].items.push(s);
      });

      for (const [catName, data] of Object.entries(groupMap)) {
        const catPercent = data.theoretical > 0 ? Math.min(100, Math.round((data.earned / data.theoretical) * 100)) : 0;
        const groupCard = document.createElement('div');
        groupCard.className = 'bg-slate-800/80 border border-slate-700/70 rounded-2xl p-4 space-y-3';

        let tasksRows = '';
        data.items.forEach(st => {
          const tPercent = st.theoretical > 0 ? Math.min(100, Math.round((st.earned / st.theoretical) * 100)) : 0;
          tasksRows += `
            <div class="space-y-1 pt-2 border-t border-slate-700/50">
              <div class="flex justify-between items-center text-xs">
                <span class="font-medium text-slate-200">${escapeHtml(st.task.title)}</span>
                <span class="font-bold text-sky-400">${st.earned.toFixed(1).replace('.0','')} / ${st.theoretical.toFixed(1).replace('.0','')} Pkt (${tPercent}%)</span>
              </div>
              <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                <div class="h-full bg-sky-500 rounded-full" style="width: ${tPercent}%"></div>
              </div>
            </div>
          `;
        });

        groupCard.innerHTML = `
          <div class="flex justify-between items-center">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-200">${escapeHtml(catName)}</h3>
            <span class="text-xs font-extrabold text-emerald-400">${data.earned.toFixed(1).replace('.0','')} / ${data.theoretical.toFixed(1).replace('.0','')} Pkt (${catPercent}%)</span>
          </div>
          <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-400 rounded-full" style="width: ${catPercent}%"></div>
          </div>
          <div class="space-y-2 mt-2">
            ${tasksRows}
          </div>
        `;

        container.appendChild(groupCard);
      }
    }

    /* ========================================================
       TASK MANAGEMENT (EDIT / DELETE / REORDER)
       ======================================================== */
    function renderManageView() {
      const container = document.getElementById('manageTasksList');
      container.innerHTML = '';
      document.getElementById('manageTaskCount').textContent = `${tasks.length} Aufgaben`;

      tasks.forEach(t => {
        const card = document.createElement('div');

        else if (t.days.length === 5 && !t.days.includes(0) && !t.days.includes(6)) dayStr = 'Mo-Fr';
        else {
          const names = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
          dayStr = t.days.map(d => names[d]).join(', ');
        }

        card.innerHTML = `
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-white truncate">${escapeHtml(t.title)}</span>
              <span class="text-[10px] px-1.5 py-0.2 rounded bg-slate-700 text-sky-400 font-semibold">Typ ${t.type}</span>
            </div>
            <div class="text-[11px] text-slate-400 flex flex-wrap gap-x-2 gap-y-0.5 mt-0.5">
              <span><i class="fa-solid fa-tag text-[9px] text-slate-500"></i> ${escapeHtml(t.category)}</span>
              <span>• ${t.points} Pkt</span>
              <span>• ${dayStr}</span>
              ${t.type === 'C' ? `<span class="text-purple-400">• Ziel: ${t.weeklyTarget}p/Woche</span>` : ''}
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button class="btn-edit-task w-8 h-8 rounded-lg bg-slate-700/60 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition active:scale-95" data-id="${t.id}" title="Bearbeiten">
              <i class="fa-solid fa-pencil text-xs"></i>
            </button>
            <button class="btn-delete-task w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 flex items-center justify-center transition active:scale-95" data-id="${t.id}" title="Löschen">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        `;

        card.querySelector('.btn-edit-task').addEventListener('click', () => openTaskModal(t.id));
        card.querySelector('.btn-delete-task').addEventListener('click', () => deleteTask(t.id));

        container.appendChild(card);
      });
    }

    function deleteTask(id) {
      const task = tasks.find(x => x.id === id);
      if (!task) return;
      // Using an in-app confirm dialog replacement or custom modal
      if (window.confirm) {
        // Fallback confirmation
        const confirmed = window.confirm(`Möchtest du "${task.title}" wirklich löschen?`);
        if (!confirmed) return;
      }
      tasks = tasks.filter(x => x.id !== id);
      saveData();
      renderManageView();
      renderChecklistView();
      showToast('Aufgabe gelöscht', 'info');
    }

    /* ========================================================
       MODAL: ADD / EDIT TASK
       ======================================================== */
    const modalTask = document.getElementById('modalTask');
    const taskForm = document.getElementById('taskForm');
    const formCategorySelect = document.getElementById('formCategorySelect');
    const customCategoryWrapper = document.getElementById('customCategoryWrapper');
    const weeklyTargetGroup = document.getElementById('weeklyTargetGroup');
    const weekdaysSelector = document.getElementById('weekdaysSelector');

    function openTaskModal(editId = null) {
      taskForm.reset();
      populateCategorySelect();

      if (editId) {
        const task = tasks.find(x => x.id === editId);
        if (!task) return;
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-sky-400"></i> Aufgabe bearbeiten';
        document.getElementById('formTaskId').value = task.id;
        document.getElementById('formTitle').value = task.title;

        // Category
        if ([...formCategorySelect.options].some(o => o.value === task.category)) {
          formCategorySelect.value = task.category;
          customCategoryWrapper.classList.add('hidden');
        } else {
          formCategorySelect.value = '__NEW__';
          customCategoryWrapper.classList.remove('hidden');
          document.getElementById('formCategoryCustom').value = task.category;
        }

        // Type
        const radio = taskForm.querySelector(`input[name="formType"][value="${task.type}"]`);
        if (radio) radio.checked = true;

        // Days
        document.querySelectorAll('.day-check').forEach(chk => {
          chk.checked = task.days.includes(parseInt(chk.value));
        });

        document.getElementById('formPoints').value = task.points;
        document.getElementById('formWeeklyTarget').value = task.weeklyTarget || 4;
        document.getElementById('formStartDate').value = task.startDate || '';
        document.getElementById('formEndDate').value = task.endDate || '';
      } else {
        document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-plus text-sky-400"></i> Neue Aufgabe erstellen';
        document.getElementById('formTaskId').value = '';
        document.getElementById('formStartDate').value = formatIsoDate(new Date());
        document.querySelectorAll('.day-check').forEach(chk => chk.checked = true);
      }

      handleTypeChangeUI();
      modalTask.classList.remove('hidden');
    }

    function closeModal() {
      modalTask.classList.add('hidden');
    }

    function populateCategorySelect() {
      const cats = new Set(['Fitness', 'Mindset & Wissen', 'Soziales', 'Sex']);
      tasks.forEach(t => {
        if (t.category) cats.add(t.category);
      });

      formCategorySelect.innerHTML = '';
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        formCategorySelect.appendChild(opt);
      });

      const newOpt = document.createElement('option');
      newOpt.value = '__NEW__';
      newOpt.textContent = '+ Neue Gruppe...';
      formCategorySelect.appendChild(newOpt);
    }

    function handleTypeChangeUI() {
      const selectedType = document.querySelector('input[name="formType"]:checked')?.value || 'A';
      const desc = document.getElementById('typeDescription');

      if (selectedType === 'A') {
        desc.textContent = 'Typ A: Fällt an ausgewählten Wochentagen fest an. Punkte verfallen bei Nicht-Erledigung.';
        weekdaysSelector.classList.remove('hidden');
        weeklyTargetGroup.classList.add('hidden');
      } else if (selectedType === 'B') {
        desc.textContent = 'Typ B: An festen Tagen geplant. Bei Nicht-Erledigung rollt die Aufgabe auf den nächsten Tag weiter (keine Doppelung).';
        weekdaysSelector.classList.remove('hidden');
        weeklyTargetGroup.classList.add('hidden');
      } else if (selectedType === 'C') {
        desc.textContent = 'Typ C: Beliebig oft verfügbar (max 1x/Tag abhaken). Definiertes Wochenziel für die Statistik.';
        weekdaysSelector.classList.add('hidden');
        weeklyTargetGroup.classList.remove('hidden');
      }
    }

    formCategorySelect.addEventListener('change', () => {
      if (formCategorySelect.value === '__NEW__') {
        customCategoryWrapper.classList.remove('hidden');
        document.getElementById('formCategoryCustom').focus();
      } else {
        customCategoryWrapper.classList.add('hidden');
      }
    });

    document.querySelectorAll('input[name="formType"]').forEach(radio => {
      radio.addEventListener('change', handleTypeChangeUI);
    });

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const id = document.getElementById('formTaskId').value || ('task_' + Date.now());
      const title = document.getElementById('formTitle').value.trim();
      let category = formCategorySelect.value;
      if (category === '__NEW__') {
        category = document.getElementById('formCategoryCustom').value.trim() || 'Allgemein';
      }

      const type = document.querySelector('input[name="formType"]:checked').value;
      const points = parseFloat(document.getElementById('formPoints').value) || 1.0;
      const weeklyTarget = parseFloat(document.getElementById('formWeeklyTarget').value) || 4.0;
      const startDate = document.getElementById('formStartDate').value;
      const endDate = document.getElementById('formEndDate').value;

      // Collect days
      const days = [];
      document.querySelectorAll('.day-check:checked').forEach(chk => {
        days.push(parseInt(chk.value));
      });

      if (type !== 'C' && days.length === 0) {
        showToast('Bitte mindestens einen Wochentag wählen', 'error');
        return;
      }

      const existingIndex = tasks.findIndex(x => x.id === id);
      const taskObject = {
        id,
        title,
        category,
        type,
        days: type === 'C' ? [0, 1, 2, 3, 4, 5, 6] : days,
        points,
        weeklyTarget: type === 'C' ? weeklyTarget : (points * (days.length || 1)),
        startDate,
        endDate
      };

      if (existingIndex >= 0) {
        tasks[existingIndex] = taskObject;
        showToast('Aufgabe erfolgreich aktualisiert', 'success');
      } else {
        tasks.push(taskObject);
        showToast('Neue Aufgabe hinzugefügt', 'success');
      }

      saveData();
      closeModal();
      if (currentTab === 'checklist') renderChecklistView();
      else if (currentTab === 'manage') renderManageView();
      else if (currentTab === 'stats') renderStatisticsView();
    });

    /* ========================================================
       NAVIGATION & TAB SWITCHING
       ======================================================== */
    const viewChecklist = document.getElementById('viewChecklist');
    const viewStats = document.getElementById('viewStats');
    const viewManage = document.getElementById('viewManage');

    const navBtnChecklist = document.getElementById('navBtnChecklist');
    const navBtnStats = document.getElementById('navBtnStats');
    const navBtnManage = document.getElementById('navBtnManage');

    function switchTab(tab) {
      currentTab = tab;

      // Update Nav active style
      [navBtnChecklist, navBtnStats, navBtnManage].forEach(btn => {
        btn.classList.remove('text-sky-400');
        btn.classList.add('text-slate-400');
      });

      viewChecklist.classList.add('hidden');
      viewStats.classList.add('hidden');
      viewManage.classList.add('hidden');

      if (tab === 'checklist') {
        navBtnChecklist.classList.add('text-sky-400');
        navBtnChecklist.classList.remove('text-slate-400');
        viewChecklist.classList.remove('hidden');
        renderChecklistView();
      } else if (tab === 'stats') {
        navBtnStats.classList.add('text-sky-400');
        navBtnStats.classList.remove('text-slate-400');
        viewStats.classList.remove('hidden');
        renderStatisticsView();
      } else if (tab === 'manage') {
        navBtnManage.classList.add('text-sky-400');
        navBtnManage.classList.remove('text-slate-400');
        viewManage.classList.remove('hidden');
        renderManageView();
      }
    }

    navBtnChecklist.addEventListener('click', () => switchTab('checklist'));
    navBtnStats.addEventListener('click', () => switchTab('stats'));
    navBtnManage.addEventListener('click', () => switchTab('manage'));

    /* ========================================================
       DATE CONTROLS & "TASKS AKTUALISIEREN"
       ======================================================== */
    document.getElementById('btnPrevDay').addEventListener('click', () => {
      selectedDate = addDays(selectedDate, -1);
      renderChecklistView();
    });

    document.getElementById('btnNextDay').addEventListener('click', () => {
      selectedDate = addDays(selectedDate, 1);
      renderChecklistView();
    });

    document.getElementById('btnJumpToday').addEventListener('click', () => {
      selectedDate = new Date();
      renderChecklistView();
      showToast('Zu Heute gesprungen', 'info');
    });

    // Date Picker Input
    const hiddenDatePicker = document.getElementById('hiddenDatePicker');
    document.getElementById('btnTriggerDatePicker').addEventListener('click', () => {
      try {
        hiddenDatePicker.showPicker();
      } catch (err) {
        hiddenDatePicker.click();
      }
    });

    hiddenDatePicker.addEventListener('change', (e) => {
      if (e.target.value) {
        selectedDate = parseIsoDate(e.target.value);
        renderChecklistView();
      }
    });

    // Button: "Tasks aktualisieren" (Neuberechnung & Sync)
    document.getElementById('btnRefreshTasks').addEventListener('click', () => {
      // Re-reads storage, resolves dynamic rules & re-renders view
      loadData();
      renderChecklistView();
      if (currentTab === 'stats') renderStatisticsView();
      showToast('Tagestasks aktualisiert und neu ermittelt', 'success');
    });

    // Reset to defaults
    document.getElementById('btnResetToDefaults').addEventListener('click', () => {
      if (window.confirm("Alle Standard-Aufgaben und Gruppen wiederherstellen? Deine Erledigungen bleiben erhalten.")) {
        tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
        saveData();
        renderManageView();
        renderChecklistView();
        showToast('Basis-Aufgaben erfolgreich wiederhergestellt', 'success');
      }
    });

    // Stats Period switch
    document.getElementById('statTabWeek').addEventListener('click', () => {
      statScope = 'week';
      document.getElementById('statTabWeek').className = 'py-1.5 text-xs font-semibold rounded-lg bg-sky-500 text-white transition';
      document.getElementById('statTabAll').className = 'py-1.5 text-xs font-medium text-slate-400 hover:text-slate-200 rounded-lg transition';
      renderStatisticsView();
    });

    document.getElementById('statTabAll').addEventListener('click', () => {
      statScope = 'all';
      document.getElementById('statTabAll').className = 'py-1.5 text-xs font-semibold rounded-lg bg-sky-500 text-white transition';
      document.getElementById('statTabWeek').className = 'py-1.5 text-xs font-medium text-slate-400 hover:text-slate-200 rounded-lg transition';
      renderStatisticsView();
    });

    // Modal buttons
    document.getElementById('btnOpenAddTask').addEventListener('click', () => openTaskModal());
    document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    document.getElementById('btnCancelModal').addEventListener('click', closeModal);

    /* ========================================================
       TOAST UTILITY
       ======================================================== */
    let toastTimeout;
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      clearTimeout(toastTimeout);
      toastMsg.textContent = msg;

      if (type === 'success') {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
      } else if (type === 'error') {
        toastIcon.className = 'fa-solid fa-triangle-exclamation text-rose-400';
      } else {
        toastIcon.className = 'fa-solid fa-circle-info text-sky-400';
      }

      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ========================================================
       BOOTSTRAP
       ======================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      renderChecklistView();
    });
  </script>
</body>
</html>
